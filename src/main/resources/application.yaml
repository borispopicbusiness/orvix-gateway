server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    kubernetes:
      config:
        name: gateway-configmap
        namespace: dev
        enableApi: true
        include-profile-specific-sources: false
      reload:
        enabled: true
        mode: event
        strategy: refresh
        monitoring-config-maps: true
      client:
        namespace: dev
      discovery:
        enabled: true
        namespaces:
          - dev
        include-not-ready-addresses: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
  config:
    import: "optional:kubernetes:"


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - refresh

  info:
    env:
      enabled: true

info:
  app:
    name: Orvix Gateway
    version: 1.0.0
    description: Orvix Gateway microservice
