version: "3.9"

services:
  keycloak:
    image: keycloak/keycloak:26.4.6
    container_name: keycloak-local-dev
    hostname: keycloak.local
    ports:
      - "9090:8080"
    # The mem_limit is still a valid YAML field in Docker due to backward compatibility with v2.
    mem_limit: 2g
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=http://keycloak:8080
#      - KC_HTTP_RELATIVE_PATH=/auth
    volumes:
      - kc-v-data:/opt/keycloak/data
      - kc-v-providers:/opt/keycloak/providers
      - kc-v-log:/opt/keycloak/log
    command: ["start-dev"]
    networks:
      - orvix-local-dev-network
  orvix-gateway-local:
    image: borispopicdev/orvix-gateway:latest
    container_name: orvix-gateway-local
    hostname: orvix-gateway.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "downstream:host-gateway"
    ports:
      - "8081:8080"
      - "5005:5005"
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - DOWNSTREAM_URI=http://downstream:8080
    networks:
      - orvix-local-dev-network

volumes:
  kc-v-data:
    name: kc-data
  kc-v-providers:
    name: kc-providers
  kc-v-log:
    name: kc-log

networks:
  orvix-local-dev-network:
    driver: bridge
